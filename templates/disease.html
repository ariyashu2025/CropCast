{% extends "base.html" %}{% block content %}<h2>🦠 Disease Risk Assessment</h2><div class="panel"><p>Classify farms into Low, Medium or High disease risk.</p><select id="m"><option value="logistic">Logistic Regression</option><option value="ridge">Logistic L2</option><option value="lasso">Logistic L1</option></select><button onclick="run()">Run Model</button><div id="r"></div></div><script>
async function run(){let d=await (await fetch("/api/disease?method="+m.value)).json();r.innerHTML=d.error?"<div class='error'>"+d.error+"</div>":`<div class="metricgrid"><div>Model<b>${d.model}</b></div><div>Accuracy<b>${d.accuracy}</b></div><div>Precision<b>${d.precision}</b></div><div>Recall<b>${d.recall}</b></div><div>F1<b>${d.f1}</b></div></div>`}</script>{% endblock %}
