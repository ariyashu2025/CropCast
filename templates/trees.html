{% extends "base.html" %}{% block content %}<h2>🌳 Tree-Based & Ensemble Algorithms</h2><div class="panel"><p>Run and compare Decision Tree, Random Forest, Extra Trees, Gradient Boosting, AdaBoost, XGBoost and LightGBM.</p><select id="m">{% for x,n in [("decision_tree","Decision Tree"),("random_forest","Random Forest"),("extra_trees","Extra Trees"),("gradient_boosting","Gradient Boosting"),("adaboost","AdaBoost"),("xgboost","XGBoost"),("lightgbm","LightGBM")] %}<option value="{{x}}">{{n}}</option>{% endfor %}</select><button onclick="run()">Run Algorithm</button><div id="r"></div></div><script>
async function run(){let d=await (await fetch("/api/tree?model="+m.value)).json();r.innerHTML=d.error?"<div class='error'>"+d.error+"</div>":`<div class="metricgrid"><div>Model<b>${d.model}</b></div><div>Accuracy<b>${d.accuracy}</b></div><div>Precision<b>${d.precision}</b></div><div>Recall<b>${d.recall}</b></div><div>F1<b>${d.f1}</b></div></div>`}</script>{% endblock %}
