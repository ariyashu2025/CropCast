{% extends "base.html" %}{% block content %}<h2>🌱 Crop Yield Prediction</h2><div class="panel"><p>Compare Linear, Ridge and Lasso Regression using MSE, RMSE and R².</p><select id="m"><option value="linear">Linear Regression</option><option value="ridge">Ridge Regression</option><option value="lasso">Lasso Regression</option></select><button onclick="run()">Run Model</button><div id="r"></div></div><script>
async function run(){let d=await (await fetch("/api/yield?method="+m.value)).json();r.innerHTML=d.error?"<div class='error'>"+d.error+"</div>":`<div class="metricgrid"><div>Model<b>${d.model}</b></div><div>MSE<b>${d.mse}</b></div><div>RMSE<b>${d.rmse}</b></div><div>R²<b>${d.r2}</b></div></div>`}</script>{% endblock %}
